name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pasta android
        run: |
          flutter create . --project-name meu_imovel --org com.joaomenezes --platforms android
          # Release precisa da permissão de internet explícita
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="meu_imovel"#android:label="Meu Imóvel"#' android/app/src/main/AndroidManifest.xml
          # Remove o teste de exemplo gerado (referencia MyApp)
          rm -f test/widget_test.dart
          # R8 quebra o shared_preferences (NoSuchMethodError getAll): desliga o shrink
          G=android/app/build.gradle.kts
          sed -i 's#signingConfig = signingConfigs.getByName("debug")#signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false#' $G
          if grep -q "isMinifyEnabled = false" $G; then echo "::notice::minify desligado"; else echo "::warning::não achei o bloco release em $G"; fi
          # Regras de segurança caso o shrink continue ativo
          cat > android/app/proguard-rules.pro <<'RULES'
          -keep class io.flutter.plugins.** { *; }
          -keep class io.flutter.plugin.** { *; }
          -keep class kotlin.coroutines.** { *; }
          -keepattributes Signature,*Annotation*,InnerClasses,EnclosingMethod
          RULES

      - name: Dependências
        run: flutter pub get

      - name: Análise
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E "^\s*(error|warning) " analyze.txt | head -20 | while read -r l; do echo "::warning title=analyze::$l"; done
          exit $code

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --dart-define-from-file=supabase.public.json 2>&1 | tee build.txt || {
            grep -E "Error|error:|FAILURE|What went wrong" -A2 build.txt | head -30 | while read -r l; do echo "::error title=build::$l"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: meu-imovel-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Meu Imóvel (build ${{ github.run_number }})
          files: build/app/outputs/flutter-apk/app-release.apk
